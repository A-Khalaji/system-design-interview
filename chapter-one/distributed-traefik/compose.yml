name: distributed-traefik

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    command:
      - postgres
      - -c
      - wal_level=replica
      - -c
      - max_wal_senders=10
      - -c
      - max_replication_slots=10
      - -c
      - max_connections=100
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - backend
    restart: unless-stopped

  replica1:
    image: postgres:17
    environment:
      PGPASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - replica1_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup -h postgres -U replicator \
            -D "$$PGDATA" -Fp -Xs -P -R \
            -C -S traefik_replica1_slot
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
    restart: unless-stopped

  replica2:
    image: postgres:17
    environment:
      PGPASSWORD: ${REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - replica2_data:/var/lib/postgresql/data
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - bash
      - -c
      - |
        if [ ! -s "$$PGDATA/PG_VERSION" ]; then
          pg_basebackup -h postgres -U replicator \
            -D "$$PGDATA" -Fp -Xs -P -R \
            -C -S traefik_replica2_slot
        fi
        exec docker-entrypoint.sh postgres -c hot_standby=on
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - backend
    restart: unless-stopped

  api1:
    build:
      context: .
      dockerfile: dockerfile
    environment: &api_environment
      DB_HOST: postgres
      DB_REPLICA_HOST: replica1
      DB_REPLICA_HOST_2: replica2
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      API_INSTANCE: api1
    depends_on:
      postgres:
        condition: service_healthy
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
    networks:
      - backend
    labels: &api_labels
      - traefik.enable=true
      - traefik.http.routers.api.rule=PathPrefix(`/`)
      - traefik.http.routers.api.entrypoints=web
      - traefik.http.services.api.loadbalancer.server.port=8080
      - traefik.docker.network=distributed-traefik_backend

  api2:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      <<: *api_environment
      API_INSTANCE: api2
    depends_on:
      postgres:
        condition: service_healthy
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
    networks:
      - backend
    labels: *api_labels

  api3:
    build:
      context: .
      dockerfile: dockerfile
    environment:
      <<: *api_environment
      API_INSTANCE: api3
    depends_on:
      postgres:
        condition: service_healthy
      replica1:
        condition: service_healthy
      replica2:
        condition: service_healthy
    networks:
      - backend
    labels: *api_labels

  traefik:
    image: traefik:v3.6
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=distributed-traefik_backend
      - --entrypoints.web.address=:80
    ports:
      - "8082:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
    name: distributed_traefik_postgres_data
  replica1_data:
    name: distributed_traefik_replica1_data
  replica2_data:
    name: distributed_traefik_replica2_data

networks:
  backend:
    driver: bridge
